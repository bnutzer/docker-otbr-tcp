name: Build and Push Docker Image

on:
  # Manual trigger
  workflow_dispatch:

  # v1 is legacy: no weekly rebuilds. GitHub only runs scheduled workflows
  # from the default branch (main = v2) anyway.

  # Build on pushes to the v1 branch
  push:
    branches:
      - v1
      - 'build-*'
    paths-ignore:
      - 'README*.md'
      - 'CLAUDE.md'
      - '.gitignore'

env:
  REGISTRY: docker.io
  IMAGE_NAME: bnutzer/otbr-tcp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # v1 is not the default branch, so is_default_branch cannot gate
          # the moving tags; check the ref explicitly (build-* branches only
          # get the immutable sha/build tags). Never emit latest from here.
          flavor: |
            latest=false
          tags: |
            type=sha,format=short,prefix=v1-sha-
            type=raw,value=v1-build-${{ github.run_number }}
            type=raw,value=v1-{{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/v1' }}
            type=raw,value=v1,enable=${{ github.ref == 'refs/heads/v1' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
